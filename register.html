<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        .errorlist {
            color: red;
            font-size: 12px;
        }

        .link {
            text-align: center;
            margin-top: 10px;
        }

        .link a {
            color: blue;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Create Account</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Show errors nicely -->
        {{ form.non_field_errors }}

        <label>Username</label>
        {{ form.username }}
        {{ form.username.errors }}

        <label>Password</label>
        {{ form.password1 }}
        {{ form.password1.errors }}

        <label>Confirm Password</label>
        {{ form.password2 }}
        {{ form.password2.errors }}

        <button type="submit">Create Account</button>
    </form>

    <div class="link">
        Already have an account? <a href="/login/">Login</a>
    </div>
</div>

</body>
</html>
